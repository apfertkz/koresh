<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кореш: настройка</title>
<style>
:root{--paper:#f4f0e8;--ink:#20201e;--orange:#ff4d2b;--yellow:#f4cb70;--white:#fffdf8;--green:#2f7d4f;--red:#c0321a;--line:3px solid var(--ink)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:var(--line);background:var(--yellow)}
header .logo{font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
header .logo i{font-style:normal;background:var(--ink);color:var(--yellow);padding:0 8px;margin-right:6px}
header .sub{font-size:14px;opacity:.75}
header .sp{flex:1}
main{max-width:860px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:30px;line-height:1.15;margin:6px 0 10px;font-weight:900}
h2{font-size:24px;line-height:1.2;margin:0 0 10px;font-weight:900}
h3{font-size:17px;margin:22px 0 8px;font-weight:800}
p{margin:8px 0}
.small{font-size:14px;opacity:.8}
.card{background:var(--white);border:var(--line);box-shadow:6px 6px 0 var(--ink);padding:20px;margin:16px 0}
.stepper{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;padding:0;list-style:none}
.stepper button{font:inherit;font-weight:700;font-size:14px;background:var(--white);color:var(--ink);border:var(--line);padding:6px 10px;min-height:44px;cursor:pointer;display:flex;gap:6px;align-items:center}
.stepper button b{display:inline-block;min-width:22px;height:22px;line-height:19px;text-align:center;border:2px solid var(--ink);border-radius:50%;font-size:12px}
.stepper button.cur{background:var(--ink);color:var(--yellow)}
.stepper button.cur b{border-color:var(--yellow)}
.stepper button.done b{background:var(--green);border-color:var(--green);color:#fff}
.btn{font:inherit;font-weight:800;background:var(--orange);color:var(--ink);border:var(--line);box-shadow:4px 4px 0 var(--ink);padding:10px 18px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;margin:6px 8px 6px 0}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--white)}
.btn.yel{background:var(--yellow)}
.btn[disabled]{opacity:.5;cursor:wait}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
label{display:block;font-weight:700;margin:14px 0 4px}
input[type=text],input[type=password],input[type=search],textarea,select{width:100%;font:inherit;background:#fff;color:var(--ink);border:var(--line);padding:9px 11px;border-radius:0}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
input[type=radio],input[type=checkbox]{width:20px;height:20px;accent-color:var(--orange);margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;border:var(--line);background:#fff;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt.sel{background:var(--yellow)}
.opt b{display:block}
.note{border:var(--line);padding:10px 14px;margin:12px 0;font-weight:600}
.note.ok{background:#dcefe2;border-color:var(--green)}
.note.bad{background:#f9d9d2;border-color:var(--red)}
.note.warn{background:var(--yellow)}
.note.info{background:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.url{font-size:19px;font-weight:700;word-break:break-all;background:var(--ink);color:var(--yellow);padding:16px;margin:10px 0;user-select:all}
.list{margin:10px 0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:7px 0}
.list li:last-child{border-bottom:0}
.tag{font-size:12px;font-weight:800;border:2px solid var(--ink);padding:0 7px;background:var(--white);white-space:nowrap}
.tag.lock{background:var(--orange)}
.tag.src{background:var(--yellow)}
.row{display:grid;grid-template-columns:1fr 1.4fr 44px;gap:8px;margin:6px 0}
.row .x{font:inherit;font-weight:900;background:var(--white);border:var(--line);cursor:pointer;min-width:44px;min-height:44px}
.phone{display:flex;align-items:stretch}
.phone .plus{font-weight:900;font-size:18px;border:var(--line);border-right:0;background:var(--yellow);padding:9px 10px;user-select:none}
.phone input{min-width:0}
.qr{display:block;margin:12px 0;border:var(--line);background:#fff;max-width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:var(--line);background:var(--white);padding:3px 12px;min-height:44px;display:inline-flex;align-items:center;font-weight:700;cursor:pointer;font-size:14px}
.chip.on{background:var(--orange)}
.steps{counter-reset:s;margin:12px 0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;border:var(--line);background:#fff;padding:12px 14px 12px 62px;margin:10px 0;min-height:60px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:36px;height:36px;line-height:32px;text-align:center;font-weight:900;font-size:20px;background:var(--orange);border:var(--line);border-radius:50%}
.mock{display:inline-block;margin-top:6px;border:2px dashed var(--ink);background:var(--paper);padding:4px 10px;font-size:14px;font-weight:700}
.mock.btnm{background:var(--yellow);border-style:solid}
.chk{font-size:12px;font-weight:800;background:var(--yellow);border:2px solid var(--ink);padding:0 6px;margin-left:4px}
.pulse{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:8px;animation:p 1s infinite}
@keyframes p{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
.big{font-size:22px}
.hidden{display:none}
.btn.sm{padding:4px 12px;box-shadow:2px 2px 0 var(--ink);margin:0;font-size:14px}
.val{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 8px 4px 0;max-width:100%}
.val .mono{background:var(--paper);border:2px dashed var(--ink);padding:6px 10px;font-weight:700;max-width:100%}
.mask{-webkit-text-security:disc;text-security:disc}
.pv{display:block;margin:8px 0}
@media (max-width:620px){.row{grid-template-columns:1fr 44px}.row input:nth-child(2){grid-column:1/2}}
</style>
</head>
<body>
<header>
  <div class="logo"><i>К</i>Кореш</div>
  <div class="sub">настройка на сервере клиента</div>
  <div class="sp"></div>
  <button class="btn alt hidden" id="logout" style="margin:0;padding:6px 12px;box-shadow:none">Выйти</button>
</header>
<main id="app"><p>Загрузка…</p></main>

<script>
"use strict";
const app = document.getElementById('app');
// replaceChildren сам превращает null в текст «null»: пропускаем пустые значения (условные заметки, кнопки)
{ const rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...k) { return rc.apply(this, k.filter(c => c != null && c !== false)); }; }
let S = null;            // состояние сервера
let step = 0;
let ui = {brain: false, iot: false, char: false, home: false, heard: false, wa: false};
let devs = null;         // список устройств {count, devices, scenarios, rooms...}
let pollTimer = null;

function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const [k, v] of Object.entries(a)) {
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function note(kind, ...kids) { return h('div', {class: 'note ' + kind}, ...kids); }
function plural(n, one, few, many) {
  const m = n % 100, d = n % 10;
  if (m > 10 && m < 20) return many;
  return d === 1 ? one : (d > 1 && d < 5 ? few : many);
}
function chk() { return h('span', {class: 'chk'}, 'ПРОВЕРИТЬ'); }

async function api(path, body) {
  const opt = {credentials: 'same-origin'};
  if (body !== undefined) { opt.method = 'POST'; opt.headers = {'Content-Type': 'application/json'}; opt.body = JSON.stringify(body); }
  let r, j = {};
  try { r = await fetch('/setup/api/' + path, opt); } catch (e) { return {ok: false, status: 0, message: 'Нет связи с сервером. Проверь интернет и попробуй ещё раз.'}; }
  try { j = await r.json(); } catch (e) { /* не JSON */ }
  if (r.status === 401 && path !== 'login') { stopPoll(); renderLogin('Сессия кончилась, введи код ещё раз.'); }
  return Object.assign({status: r.status, ok: r.ok}, j);
}

function btn(label, fn, cls) {
  const b = h('button', {type: 'button', class: 'btn ' + (cls || '')}, label);
  b.addEventListener('click', async () => {
    if (b.disabled) return;
    b.disabled = true;
    try { await fn(b); } finally { b.disabled = false; }
  });
  return b;
}
function srcTag(src) {
  if (src === 'pack') return h('span', {class: 'tag src', title: 'Пришло с пакетом активации'}, 'из пакета активации');
  return src === 'env' ? h('span', {class: 'tag src', title: 'Задано в переменных Railway: страница это не перекроет'}, 'из переменных Railway') : null;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* запасной путь ниже */ }
  const t = h('textarea', {readonly: true, 'aria-hidden': 'true', style: 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0'});
  t.value = text; document.body.append(t); t.focus(); t.select();
  try { t.setSelectionRange(0, text.length); } catch (e) { /* iOS */ }
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  t.remove(); return ok;
}
function selectNode(el) {
  try { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* не страшно */ }
}

/* внешняя ссылка: всегда в новой вкладке, без передачи opener */
function ext(url, label, cls) {
  return h('a', {class: 'btn ' + (cls || 'yel'), href: url, target: '_blank', rel: 'noopener noreferrer'}, label);
}
/* значение для вставки в чужую форму + кнопка «скопировать» (с подтверждением рядом) */
function val(value, label) {
  const sp = h('span', {class: 'mono'}, value);
  const msg = h('span', {class: 'small', role: 'status'});
  const b = btn(label || 'Скопировать', async () => {
    const ok = await copyText(value);
    if (!ok) selectNode(sp);
    msg.textContent = ok ? 'Скопировано' : 'Само не скопировалось: значение выделено, скопируй вручную.';
  }, 'alt sm');
  return h('span', {class: 'val'}, sp, b, msg);
}
/* Названия навыка: по-русски, активационное имя из двух слов (по умолчанию «<имя> дома») */
function skillNames() {
  const nm = (S && S.name && S.name.value || 'Кореш').trim();
  const latin = /[A-Za-z]/.test(nm);
  const title = latin ? 'Кореш' : nm;
  const low = title.toLowerCase();
  return {title, activation: /\s/.test(low) ? low : low + ' дома', latin};
}

/* ---------- вход / закрыто ---------- */
function setLogout(show) { document.getElementById('logout').classList.toggle('hidden', !show); }
document.getElementById('logout').addEventListener('click', async () => { stopPoll(); await api('logout', {}); renderLogin(); });

const WA_LOST_TEXT = 'WhatsApp отвалился: Кореш не сможет писать сообщения, пока номер не привязан заново. Введи код из бота и привяжи заново.';
function renderLogin(msg, closed, waLost) {
  setLogout(false);
  // код KR-… из бота: обычное текстовое поле (его нужно сверить глазами), автозаполнение браузера гасим
  const input = h('input', {type: 'text', class: 'mono', name: 'koresh-login-code', autocomplete: 'off', autocapitalize: 'characters', autocorrect: 'off',
    spellcheck: 'false', 'data-lpignore': 'true', 'data-1p-ignore': 'true', 'data-form-type': 'other', placeholder: 'KR-XXXX-XXXX-XXXX', 'aria-label': 'Код из бота'});
  const out = h('div');
  const go = async (mode) => {
    out.replaceChildren();
    const code = input.value.trim();
    if (!code) { out.append(note('bad', 'Введи код из бота.')); return; }
    const r = await api('login', {code, reopen: mode === 'reopen', wa: mode === 'wa'});
    input.value = '';
    if (r.ok) { if (r.wa_only) renderWaOnly(); else start(); return; }
    if (r.error === 'closed') { renderLogin(r.message, true); return; }
    out.append(note('bad', r.message || 'Не получилось войти.'));
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(closed ? 'reopen' : ''); });
  app.replaceChildren(h('div', {class: 'card'},
    h('h1', 0, closed ? 'Настройка завершена' : 'Вход в настройку'),
    waLost ? note('bad', WA_LOST_TEXT) : null,
    msg ? note(closed ? 'info' : 'warn', msg) : null,
    h('p', 0, closed
      ? 'Страница закрыта. Чтобы поменять настройки, введи код из бота и нажми «Перенастроить». Если нужно только заново привязать WhatsApp, нажми кнопку ниже: остальные настройки при этом не открываются.'
      : 'Введи код из бота: он начинается с KR- и лежит в чате с ботом-установщиком на шаге про /setup. Больше никаких кодов не нужно.'),
    input, out,
    closed ? h('p', {class: 'small'}, 'Нужны только модули, кодовая фраза взрослого, часовой пояс или баланс Anthropic? ', h('a', {href: '/setup/moduli'}, 'Открыть страницу модулей'), ': она ничего не перенастраивает.') : null,
    closed ? h('div', {class: 'nav'}, btn('Перенастроить', () => go('reopen')), btn('Привязать WhatsApp заново', () => go('wa'), 'alt'))
           : btn('Войти', () => go(''))));
}

/* ---------- каркас мастера ---------- */
const STEPS = ['Мозг', 'Умный дом', 'Характер', 'Дом', 'Алиса', 'Проверка', 'WhatsApp', 'Готово'];
const LAST = STEPS.length - 1;
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function start() {
  const r = await api('state');
  if (!r.ok) { renderLogin(); return; }
  S = r;
  devs = null;
  setLogout(true);
  go(0);
}
function go(n) {
  stopPoll();
  step = Math.max(0, Math.min(STEPS.length - 1, n));
  const views = [stepBrain, stepIot, stepChar, stepHome, stepAlice, stepCheck, stepWa, stepDone];
  const nav = h('ul', {class: 'stepper'}, STEPS.map((t, i) => {
    const d = [ui.brain, ui.iot || (S && S.iot.set), ui.char, ui.home, false, ui.heard, ui.wa || !!(S && S.wa && S.wa.linked && !S.wa.lost), false][i];
    return h('li', 0, h('button', {type: 'button', class: (i === step ? 'cur ' : '') + (d && i !== LAST ? 'done' : ''), on: {click: () => go(i)}},
      h('b', 0, d && i !== LAST ? '✓' : i + 1), t));
  }));
  const body = h('div', {class: 'card'}, waBanner(), views[step]());
  const nxt = step < LAST ? btn('Дальше', () => go(step + 1)) : null;
  const prv = step > 0 ? btn('Назад', () => go(step - 1), 'alt') : h('span');
  app.replaceChildren(nav, body, h('div', {class: 'nav'}, prv, nxt));
  window.scrollTo(0, 0);
}

/* баланс Anthropic: считаем траты сами (остаток с обычного ключа не прочитать), клиент говорит, сколько закинул */
function money(x) { return '$' + (Math.round(x * 100) / 100).toFixed(2); }
function balanceBlock() {
  const B = S.balance || {budget_usd: 5, spent_usd: 0, remaining_usd: 5, days_left: null};
  const amount = h('input', {type: 'text', inputmode: 'decimal', name: 'anthropic-topup', autocomplete: 'off', 'aria-label': 'Сколько ты закинул на Anthropic, в долларах',
    value: String(B.budget_usd), style: 'width:6em'});
  const out = h('div');
  const line = (b) => b.budget_usd > 0
    ? 'Потрачено ' + money(b.spent_usd) + ' из ' + money(b.budget_usd) + (b.days_left ? ', хватит примерно на ' + b.days_left + ' дн.' : '') + '. Это оценка из токенов, точный остаток виден только в консоли Anthropic.'
    : 'Слежение выключено (сумма 0). Годится, если в Anthropic включено автопополнение.';
  const status = h('p', {class: 'small'}, line(B));
  return h('div', {class: 'balance'},
    h('h3', 0, 'Баланс на Anthropic'),
    h('p', 0, '$5 на Anthropic это баланс на разговоры, а не разовый платёж: он тратится по ходу болтовни. Кореш считает траты и заранее скажет голосом, когда деньги будут на исходе. Совет: включи в Anthropic автопополнение (Billing, Auto-reload: порог $2, пополнять на $5), тогда баланс не кончится. С автопополнением поставь здесь 0, чтобы Кореш не предупреждал зря.'),
    h('label', 0, 'Сколько ты закинул на Anthropic ($) ', amount),
    h('div', 0, btn('Я пополнил', async () => {
      const r = await api('topup', {amount: amount.value});
      if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
      S.balance = r.balance;
      status.textContent = line(r.balance);
      out.replaceChildren(note('ok', 'Записал. Счётчик трат с нуля.'));
    })),
    status, out);
}

/* ---------- 1. мозг ---------- */
function stepBrain() {
  const out = h('div');
  return h('div', 0,
    h('h2', 0, 'Шаг 1. Мозг'),
    h('p', 0, 'Кореш думает через Anthropic. Ключ лежит в переменной ANTHROPIC_API_KEY в Railway: его туда вставляет сам клиент. Здесь мы только проверяем, что ключ рабочий и на счету есть деньги.'),
    S.brain_key_set
      ? note('ok', 'Ключ в переменных есть. Модель: ', h('span', {class: 'mono'}, S.model))
      : note('bad', 'Ключа ANTHROPIC_API_KEY в переменных нет. Клиент вставляет его в Railway, во вкладке Variables. Сервис перезапустится, потом обнови эту страницу.'),
    balanceBlock(),
    h('p', {class: 'small'}, 'Проверка делает один крошечный платный вызов (доли цента) и только по нажатию кнопки.'),
    btn('Проверить ключ', async () => {
      out.replaceChildren(note('info', 'Спрашиваю у мозга…'));
      const r = await api('check-brain', {});
      const good = r.ok && r.status === 'ok';
      out.replaceChildren(note(good ? 'ok' : 'bad', r.message || 'Не получилось.'));
      if (good) ui.brain = true;
    }),
    out);
}

/* ---------- 2. умный дом ---------- */
function deviceList(d) {
  if (!d) return null;
  const lockLabel = d.locks_enabled ? 'замок: управление по кодовой фразе' : 'заблокирован по умолчанию';
  return h('div', 0,
    note('ok', 'Вижу ' + d.count + ' ' + plural(d.count, 'устройство', 'устройства', 'устройств') + (d.scenarios.length ? ' и ' + d.scenarios.length + ' ' + plural(d.scenarios.length, 'сценарий', 'сценария', 'сценариев') : '') + (d.rooms.length ? ' в комнатах: ' + d.rooms.join(', ') : '') + '.'),
    d.locked_count ? note('warn', 'Замки, ворота и сигнализация (' + d.locked_count + ') ' + (d.locks_enabled ? 'управляются только после кодовой фразы.' : 'заблокированы: голосом их не открыть, пока не включишь это на шаге 4.')) : null,
    h('ul', {class: 'list'},
      d.devices.map(x => h('li', 0, h('b', 0, x.name || '(без названия)'), h('span', {class: 'tag'}, x.type), x.room ? h('span', {class: 'small'}, x.room) : null,
        x.locked ? h('span', {class: 'tag lock'}, lockLabel) : null)),
      d.scenarios.map(x => h('li', 0, h('b', 0, x.name || '(без названия)'), h('span', {class: 'tag'}, 'сценарий'),
        x.locked ? h('span', {class: 'tag lock'}, lockLabel) : null))));
}
/* код активации (тариф «Настрою сам»): вход Яндексом идёт через центральный колбэк сервера лицензий */
function licenseBlock(onIot) {
  const L = S.license;
  if (!L || !L.configured) return null;
  const code = h('input', {type: 'text', class: 'mono', name: 'koresh-activation-code', autocomplete: 'off', autocapitalize: 'characters', autocorrect: 'off',
    spellcheck: 'false', placeholder: 'KR-XXXX-XXXX-XXXX', 'aria-label': 'Код активации', value: S.login_code || ''});
  const out = h('div');
  const tick = async () => {
    const r = await api('license/status');
    if (!r.ok || r.status === 'pending' || r.status === 'none') return;
    stopPoll();
    if (r.status === 'failed') { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
    S.license.active = true;
    if (r.iot) { S.iot = {set: true, source: 'setup'}; devs = r.devices; ui.iot = true; if (onIot) onIot(); }
    out.replaceChildren(
      note('ok', 'Код принят: персональные настройки получены и сохранены зашифрованными.'),
      r.saved ? null : note('warn', 'Диск недоступен: настройки живут до перезапуска. Проверь Volume на /data.'),
      r.iot ? note('ok big', 'Готово, жми «Дальше». ', btn('Дальше', () => go(2))) : null,
      r.iot ? deviceList(devs) : note('warn', 'Умный дом не подключился автоматически. Вставь токен вручную ниже.'));
  };
  const start = btn('Войти через Яндекс', async () => {
    out.replaceChildren(note('info', 'Проверяю код…'));
    const r = await api('license/start', {code: code.value});
    if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
    out.replaceChildren(
      note('info', 'Открой вход Яндексом под аккаунтом Станции и нажми «Разрешить». Потом откроется страница «Вы подключаете Кореша к серверу ...» с адресом ЭТОГО сервера: если адрес твой, нажми «Да». Возвращайся сюда: страница продолжит сама.'),
      ext(r.authorize_url, 'Открыть вход Яндексом'));
    stopPoll();
    pollTimer = setInterval(tick, 2000);
  });
  return h('div', 0,
    h('h3', 0, 'Код активации'),
    L.active ? note('ok', 'Код уже активирован. Можно ввести другой, если нужно.') : null,
    h('p', 0, 'Это тот же код из бота, которым ты вошла на страницу, он уже вписан. Один вход Яндексом: и персональные настройки, и умный дом подключатся сами. Не вышло: ручной путь ниже работает как раньше.'),
    h('label', 0, 'Код'), code, start, out);
}
function stepIot() {
  const out = h('div');
  const list = h('div');
  // не type=password: браузер подсовывает туда сохранённый пароль. Значение прячем стилем, автозаполнение гасим.
  const tok = h('input', {type: 'text', class: 'mask', name: 'koresh-yandex-token', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
    'data-lpignore': 'true', 'data-1p-ignore': 'true', 'data-form-type': 'other', placeholder: 'Вставь токен от Яндекса (начинается с y0_)', 'aria-label': 'Токен умного дома'});
  tok.value = '';
  const cid = h('input', {type: 'text', autocomplete: 'off', placeholder: 'ClientID своего приложения', 'aria-label': 'ClientID'});
  const link = (id) => 'https://oauth.yandex.ru/authorize?response_type=token&client_id=' + encodeURIComponent(id);
  const myLink = h('div');
  cid.addEventListener('input', () => {
    const v = cid.value.trim();
    myLink.replaceChildren(/^[A-Za-z0-9]{10,64}$/.test(v) ? ext(link(v), 'Войти через Яндекс') : null);
  });
  const gos = note('warn', 'Если Яндекс просит верификацию приложения через Госуслуги, пропусти: для себя всё работает и без неё. ', chk());

  // жёлтая плашка про общее приложение пугает: показываем её, только пока умный дом не подключён (и прячем, как только подключился)
  const plaque = (!S.yandex_client_id && !S.iot.set)
    ? note('warn', 'Общее приложение «Кореш» не подключено (нет YANDEX_OAUTH_CLIENT_ID). Идём запасным путём: клиент создаёт своё приложение в Яндексе.') : null;
  const main = S.yandex_client_id
    ? h('div', 0,
        h('ol', {class: 'steps'},
          h('li', 0, 'Нажми кнопку. Откроется Яндекс (вход под аккаунтом, к которому привязана Станция и умные устройства).', h('br'),
            ext(link(S.yandex_client_id), 'Войти через Яндекс')),
          h('li', 0, 'Нажми «Разрешить». Яндекс покажет страницу с длинным токеном.'),
          h('li', 0, 'Скопируй токен целиком и вставь его в поле ниже. Яндекс его потом не покажет.')),
        gos)
    : h('div', 0,
        plaque,
        h('ol', {class: 'steps'},
          h('li', 0, 'Открой страницу создания приложения под Яндекс ID клиента.', h('br'),
            ext('https://oauth.yandex.ru/client/new', 'Открыть oauth.yandex.ru'), ' ', chk()),
          h('li', 0, 'Название: ', val('Кореш'), h('br'), 'Платформа «Веб-сервисы». Redirect URI: ', val('https://oauth.yandex.ru/verification_code')),
          h('li', 0, 'Права доступа: раздел «Дополнительные» → «Название доступа», отметь оба: ', val('iot:view'), val('iot:control'),
            h('br'), 'В разделе «Основные» ничего не отмечай. Сохрани и скопируй ClientID.', ' ', chk()),
          h('li', 0, 'Вставь ClientID ниже, нажми появившуюся кнопку, на странице Яндекса «Разрешить», скопируй токен.', h('br'), cid, myLink)),
        gos);

  const check = btn('Проверить и сохранить', async () => {
    out.replaceChildren(note('info', 'Спрашиваю у Яндекса…'));
    const r = await api('iot-token', {token: tok.value});
    if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
    tok.value = '';
    S.iot = {set: true, source: r.shadowed_by_env ? 'env' : 'setup'};
    devs = r.devices; ui.iot = true;
    out.replaceChildren(
      r.shadowed_by_env ? note('warn', 'Токен рабочий, но в Railway уже задан YANDEX_IOT_TOKEN, и он главнее. Чтобы работал новый, удали старую переменную.') : null,
      r.persisted ? null : note('warn', 'Диск недоступен: токен сохранён только до перезапуска. Проверь Volume на /data (шаг «Готово» покажет подробности).'),
      deviceList(devs));
  });

  const show = btn('Показать устройства', async () => {
    list.replaceChildren(note('info', 'Загружаю…'));
    const r = await api('devices');
    if (!r.ok) { list.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
    devs = r.devices; list.replaceChildren(deviceList(devs));
  }, 'alt');

  return h('div', 0,
    h('h2', 0, 'Шаг 2. Умный дом'),
    h('p', 0, 'Без этого Кореш только болтает. Токен даёт ему право включать свет и розетки. Права на замки и ворота у него всё равно нет, пока ты сам не включишь их на шаге 4.'),
    licenseBlock(() => { if (plaque) plaque.className = 'note warn hidden'; }),
    S.iot.set ? note('ok', 'Токен уже есть ', srcTag(S.iot.source), ' Можно показать устройства или вставить новый токен.') : null,
    S.iot.set ? h('div', 0, show, list) : null,
    main,
    h('label', 0, 'Токен'), tok, h('p', {class: 'small'}, 'Вставь токен от Яндекса: он начинается с y0_. Браузер сохранённые пароли сюда подставлять не должен; если подставил, сотри поле.'), check, out);
}

/* ---------- 4. дом ---------- */
function pairEditor(pairs, ph1, ph2, listId) {
  const wrap = h('div');
  const add = (a, b) => {
    const row = h('div', {class: 'row'},
      h('input', {type: 'text', maxlength: 40, placeholder: ph1, value: a || ''}),
      h('input', {type: 'text', maxlength: 60, placeholder: ph2, value: b || '', list: listId || null}),
      h('button', {type: 'button', class: 'x', 'aria-label': 'Убрать', on: {click: () => row.remove()}}, '×'));
    wrap.append(row);
  };
  Object.entries(pairs).forEach(([a, b]) => add(a, b));
  if (!Object.keys(pairs).length) add('', '');
  wrap.values = () => [...wrap.querySelectorAll('.row')].map(r => { const i = r.querySelectorAll('input'); return [i[0].value, i[1].value]; });
  wrap.addRow = () => add('', '');
  return wrap;
}
function modulesBlock() {
  const m = S.modules || {};
  if (!m.timers && !m.kids) return null;
  const out = h('div');
  const tz = h('input', {type: 'text', inputmode: 'decimal', maxlength: 5, value: String(S.tz_offset.value), 'aria-label': 'Часовой пояс'});
  const kp = h('input', {type: 'password', autocomplete: 'new-password', maxlength: 80,
    placeholder: S.kids_phrase.set ? 'Фраза задана. Оставь пустым, чтобы не менять' : 'Кодовая фраза взрослого (минимум 2 слова)', 'aria-label': 'Кодовая фраза взрослого'});
  const kc = h('input', {type: 'checkbox'});
  return h('div', 0,
    h('h3', 0, 'Модули'),
    m.timers ? h('div', 0,
      h('label', 0, 'Часовой пояс для напоминаний (часы от UTC, Алматы это 5)'), tz) : null,
    m.kids ? h('div', 0,
      h('label', 0, 'Кодовая фраза взрослого для детского режима'), kp,
      S.kids_phrase.set ? h('label', {class: 'opt', style: 'font-weight:400'}, kc, h('span', 0, 'Стереть сохранённую фразу')) : null,
      h('p', {class: 'small'}, 'Без этой фразы детский режим не включится: сначала задай её. Выключается только её произнесением. Не говори её при детях. Минимум два слова, например «синяя ромашка». Три неверные попытки подряд, и Кореш на 10 минут перестаёт принимать выключение. Фраза нигде не показывается.')) : null,
    btn('Сохранить модули', async () => {
      if (kp.value.trim() && kp.value.trim().split(/\s+/).filter(Boolean).length < 2) { out.replaceChildren(note('bad', 'Кодовая фраза взрослого: минимум два слова.')); return; }
      const r = await api('modules', {tz_offset: m.timers ? tz.value : '', kids_phrase: kp.value, clear_kids_phrase: kc.checked});
      kp.value = '';
      if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
      const st = await api('state'); if (st.ok) { S = st; }
      out.replaceChildren(note('ok', 'Сохранено. Применяется сразу.'), r.persisted ? null : note('warn', 'Диск недоступен: настройки живут до перезапуска.'));
    }, 'alt'),
    out);
}

function stepHome() {
  const out = h('div');
  const owner = h('input', {type: 'text', maxlength: 40, value: S.owner || '', placeholder: 'Как к тебе обращаться', 'aria-label': 'Имя хозяина'});
  const dl = h('datalist', {id: 'rooms-dl'});
  const people = pairEditor(S.people, 'Имя (Айгуль)', 'Кто это (жена)');
  const rooms = pairEditor(S.rooms, 'Как говорите (детская)', 'Как названо в Яндексе', 'rooms-dl');
  let blocked = [...S.blocked];
  const chips = h('div', {class: 'chips'}), sugg = h('div', {class: 'chips'});
  const word = h('input', {type: 'text', maxlength: 40, placeholder: 'Слово из названия устройства', 'aria-label': 'Слово'});
  function paintBlocked() {
    chips.replaceChildren(...blocked.map(w => h('span', {class: 'chip on', title: 'Убрать', on: {click: () => { blocked = blocked.filter(x => x !== w); paintBlocked(); }}}, w + ' ×')));
    if (!blocked.length) chips.append(h('span', {class: 'small'}, 'Пока ничего не добавлено.'));
  }
  paintBlocked();
  const addWord = (w) => { w = (w || '').trim().toLowerCase(); if (w && !blocked.includes(w)) { blocked.push(w); paintBlocked(); } };
  function fillDevices() {
    if (!devs) return;
    dl.replaceChildren(...devs.rooms.map(r => h('option', {value: r})));
    sugg.replaceChildren(...devs.devices.filter(d => !d.locked).map(d => h('span', {class: 'chip', title: 'Добавить в «не трогать»', on: {click: () => addWord(d.name)}}, d.name)));
  }
  if (S.iot.set && !devs) api('devices').then(r => { if (r.ok) { devs = r.devices; fillDevices(); } });
  fillDevices();

  const allow = h('input', {type: 'checkbox', checked: S.allow_locks.value});
  const phrase = h('input', {type: 'password', autocomplete: 'new-password', maxlength: 80,
    placeholder: S.lock_phrase.set ? 'Фраза задана. Оставь пустым, чтобы не менять' : 'Кодовая фраза (минимум 6 символов)', 'aria-label': 'Кодовая фраза'});
  const clear = h('input', {type: 'checkbox'});
  const hhOver = S.household_source === 'env' || S.blocked_source === 'env' || S.allow_locks.source === 'env' || S.lock_phrase.source === 'env';

  return h('div', 0,
    h('h2', 0, 'Шаг 4. Дом'),
    hhOver ? note('warn', 'Что-то из этого задано в переменных Railway (HOUSEHOLD, BLOCKED_NAMES, ALLOW_LOCKS, LOCK_PHRASE) и главнее страницы.') : null,
    h('label', 0, 'Как обращаться к хозяину'), owner,
    h('h3', 0, 'Кто есть кто в доме'),
    h('p', {class: 'small'}, 'Чтобы Кореш понимал «жена» и «Айгуль» как одного человека.'),
    people, btn('+ ещё человек', () => people.addRow(), 'alt'),
    h('h3', 0, 'Как зовутся комнаты'),
    h('p', {class: 'small'}, 'Слева как говорят в семье, справа как комната названа в приложении «Дом с Алисой». Можно несколько строк на одну комнату (синонимы).'),
    dl, rooms, btn('+ ещё комната', () => rooms.addRow(), 'alt'),
    h('h3', 0, 'Что не трогать никогда'),
    h('p', {class: 'small'}, 'Устройства и сценарии, в названии которых есть эти слова, Кореш не тронет. Совпадение по слову: «лампа» закроет все лампы.'),
    chips,
    S.iot.set ? sugg : null,
    h('div', {class: 'row', style: 'grid-template-columns:1fr auto'}, word, btn('Добавить', () => { addWord(word.value); word.value = ''; }, 'alt')),
    h('h3', 0, 'Замки, ворота, сигнализация'),
    note('warn', 'По умолчанию выключено. Голос не проверяет, кто говорит: гость скажет «открой замок». Включай только если клиент понимает риск и придумал длинную кодовую фразу.'),
    h('label', {class: 'opt', style: 'font-weight:700'}, allow, h('span', 0, 'Разрешить замки, ворота и сигнализацию по кодовой фразе')),
    h('label', 0, 'Кодовая фраза'), phrase,
    S.lock_phrase.set ? h('label', {class: 'opt', style: 'font-weight:400'}, clear, h('span', 0, 'Стереть сохранённую фразу')) : null,
    h('p', {class: 'small'}, 'После сохранения фраза нигде не показывается. Её знает только клиент, в карточку клиента её не пишем.'),
    modulesBlock(),
    btn('Сохранить', async () => {
      const r = await api('home', {owner: owner.value, people: people.values(), rooms: rooms.values(), blocked,
        allow_locks: allow.checked, lock_phrase: phrase.value, clear_lock_phrase: clear.checked});
      phrase.value = '';
      if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
      S.lock_phrase.set = r.locks_enabled || (S.lock_phrase.set && !clear.checked) || false;
      const st = await api('state'); if (st.ok) { S = st; }
      ui.home = true;
      out.replaceChildren(note('ok', 'Сохранено. Применяется сразу.'),
        r.locks_enabled ? note('warn', 'Замки включены: управлять ими можно только после кодовой фразы.') : note('info', 'Замки выключены.'),
        r.persisted ? null : note('warn', 'Диск недоступен: настройки живут до перезапуска.'));
    }),
    out);
}

        h('br'), 'Активационное имя, два слова: ', val(sk.activation), ' ', chk(),
        h('div', {class: 'small'}, 'Впиши в Диалогах именно это активационное имя: его же ты потом скажешь Алисе (бот на шаге про навык просит то же самое).'),
        h('div', {class: 'small'}, 'Два слова, чтобы имя не путалось с самой Алисой и с другими навыками. [ПРОВЕРИТЬ правила Яндекса для активационного имени: допустимая длина и слова.]'),
        sk.latin ? h('div', {class: 'small'}, 'Имя ассистента написано латиницей, а Яндекс принимает название и активационное имя по-русски, поэтому подставлено «Кореш».') : null),
      h('li', 0, 'Backend: Webhook URL. Вставь адрес из жёлтого блока выше.', h('br'), h('span', {class: 'mock'}, 'Webhook URL: https://…/alice/••••••••'), ' ', chk()),
      h('li', 0, 'Доступ: ', h('b', 0, 'Приватный'), '. Поверхности: колонки и приложение. Сохрани.', h('br'),
        h('span', {class: 'mock'}, '(•) Приватный'), ' ', chk()),
      h('li', 0, 'Голос навыка в консоли: ', h('b', 0, male ? 'мужской (нейроголос, например «Филипп»)' : 'голос Алисы (женский)'),
        '. Это под пол ассистента с шага 3 (сейчас там ', h('b', 0, male ? 'мужской' : 'женский'), '). Если в консоли выберешь другой голос, вернись на шаг 3 и поставь тот же пол, иначе род в речи разойдётся с голосом.', ' ',
        chk(), h('div', {class: 'small'}, 'Не подтверждено докой: как называется пункт выбора голоса и какие голоса доступны навыку на Станции.')),
      h('li', 0, 'Вкладка «Тестирование»: напиши «привет». Должен прийти ответ. Потом иди на шаг 6, там страница сама услышит Яндекс.', ' ', chk()),
      h('li', 0, 'Для публикации Яндекс просит примеры фраз, имя разработчика, категорию, описание, иконку 224x224. Для личного пользования хватает приватного черновика.', ' ', chk())),
    h('p', {class: 'small'}, 'Схемы с пунктирной рамкой нарисованы по документации, это не скриншоты. Пометка «ПРОВЕРИТЬ»: подпись в интерфейсе Яндекса могла отличаться, сверяемся по факту и записываем.'),
    null);
}

/* ---------- 6. проверка ---------- */
function stepCheck() {
  const status = h('div', {class: 'note info big'}, h('span', {class: 'pulse'}), 'Жду, пока Яндекс постучится…');
  const out = h('div');
  let since = 1e12;
  function heardUI(r) {
    ui.heard = true;
    if (r.kind === 'launch') {      // навык запущен без реплики (пустая): опрос не гасим, ждём настоящее «привет»
      status.className = 'note ok big'; status.replaceChildren('Навык запущен — скажи «привет»');
      return;
    }
    stopPoll();
    const said = r.kind === 'ping' ? 'Яндекс достучался (проверка связи).' : 'Кореш тебя услышал: «' + r.text + '»';
    status.className = 'note ok big'; status.replaceChildren(said);
  }
  async function tick() {
    const r = await api('heard?since=' + since);
    if (r.ok && r.heard) heardUI(r);
  }
  api('heard?since=1e12').then(r => { if (r.ok) { since = r.now; pollTimer = setInterval(tick, 2000); } });
  return h('div', 0,
    h('h2', 0, 'Шаг 6. Проверка'),
    h('p', 0, 'Скажи Алисе ровно то активационное имя, которое ты вписала в Диалогах (мы предлагали «', h('b', 0, skillNames().activation), '»). Например: «Алиса, запусти навык ', h('b', 0, skillNames().activation), '». Потом скажи «привет». Либо напиши «привет» во вкладке «Тестирование» в консоли Диалогов. Страница сама поймает запрос.'),
    status,
    h('h3', 0, 'Без Станции'),
    h('p', 0, 'Кнопка шлёт тестовую реплику на этот же вебхук. Так видно, что мозг и связка работают, даже пока навык ещё не создан. Это один обычный вызов мозга (доли цента).'),
    btn('Тест без Станции', async () => {
      out.replaceChildren(note('info', 'Спрашиваю у Кореша…'));
      const r = await api('self-test', {});
      if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Тест не прошёл.')); return; }
      out.replaceChildren(note('ok', 'Кореш ответил: «' + r.text + '»'));
    }, 'yel'),
    out);
}

/* ---------- 7. WhatsApp (необязательно) ---------- */
function waBanner() {
  return S && S.wa && S.wa.lost ? note('bad', 'WhatsApp отвалился: Кореш не может писать сообщения. Привяжи номер заново на шаге «WhatsApp».') : null;
}
/* номер: «+» вынесен из поля и стереть его нельзя; в поле только цифры */
function phoneField(value) {
  const inp = h('input', {type: 'text', inputmode: 'numeric', maxlength: 11, placeholder: '7XXXXXXXXXX', 'aria-label': 'Номер после плюса', value: String(value || '').replace(/\D/g, ''), class: 'mono'});
  inp.addEventListener('input', () => { inp.value = String(inp.value).replace(/\D/g, '').slice(0, 11); });
  const box = h('div', {class: 'phone'}, h('span', {class: 'plus'}, '+'), inp);
  box.digits = () => String(inp.value).replace(/\D/g, '');
  return box;
}
function stepWa() {
  const root = h('div', 0, h('h2', 0, 'Шаг 7. WhatsApp (необязательно)'));
  const body = h('div', 0, note('info', 'Загружаю…'));
  root.append(body);
  waRender(body, false);
  return root;
}
function renderWaOnly() {
  stopPoll();
  setLogout(true);
  const body = h('div', 0, note('info', 'Загружаю…'));
  app.replaceChildren(h('div', {class: 'card'}, h('h1', 0, 'WhatsApp: привязка'),
    h('p', 0, 'Настройка Кореша закрыта, здесь только WhatsApp. Когда закончишь, нажми «Выйти» вверху.'), body));
  waRender(body, true);
}
async function waRender(body, only) {
  const r = await api('wa/state');
  if (!r.ok) { body.replaceChildren(note('bad', r.message || 'Не получилось загрузить состояние WhatsApp.')); return; }
  if (S && !only) S.wa = r;
  if (!r.enabled) {
    body.replaceChildren(note('info', r.switched_off ? 'WhatsApp выключен в настройках сервера (WA_ENABLED=0).' : 'В этом образе WhatsApp недоступен.'));
    return;
  }
  const link = h('div');
  const contacts = h('div');
  body.replaceChildren(
    h('p', 0, 'Кореш сможет писать сообщения людям из твоих контактов в WhatsApp. Только по твоей просьбе и только после твоего «да»: он зачитывает текст и получателя, а уходит ровно то, что зачитано. Чужие сообщения он не читает.'),
    h('p', {class: 'small'}, 'Лимит: не больше ' + r.limits.hour + ' сообщений в час и ' + r.limits.day + ' в сутки.'),
    r.lost ? note('bad', WA_LOST_TEXT.replace(' Введи код из бота и привяжи заново.', ' Привяжи заново ниже.')) : null,
    link,
    h('h3', 0, 'Кому Кореш может писать'),
    contacts);
  waLink(link, r, only);
  waContacts(contacts, r);
}
function waLink(box, W, only) {
  if (!W.consent) {
    const cb = h('input', {type: 'checkbox'});
    const out = h('div');
    box.replaceChildren(
      h('h3', 0, 'Привязка'),
      note('warn', W.consent_text),
      h('label', {class: 'opt', style: 'font-weight:700'}, cb, h('span', 0, 'Я понимаю риск и хочу подключить WhatsApp')),
      btn('Показать QR-код', async () => {
        if (!cb.checked) { out.replaceChildren(note('bad', 'Без галочки WhatsApp не подключаем: прочитай предупреждение и согласись с риском.')); return; }
        const r = await api('wa/consent', {accepted: true});
        if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
        W.consent = true;
        waLink(box, W, only);
      }),
      out);
    return;
  }
  const status = h('div');
  const pairOut = h('div');
  const phone = phoneField('');
  box.replaceChildren(
    h('h3', 0, 'Привязка'),
    status,
    h('h3', 0, 'Страница открыта на телефоне?'),
    h('p', {class: 'small'}, 'Тогда QR отсканировать нечем: введи номер, на котором WhatsApp, и получи код из восьми символов.'),
    h('div', {class: 'row', style: 'grid-template-columns:1fr auto'}, phone, btn('Получить код', async () => {
      const d = phone.digits();
      if (d.length < 10) { pairOut.replaceChildren(note('bad', 'Впиши номер полностью: +7 и ещё десять цифр.')); return; }
      pairOut.replaceChildren(note('info', 'Прошу код у WhatsApp…'));
      const r = await api('wa/pair', {phone: '+' + d});
      if (!r.ok) { pairOut.replaceChildren(note('bad', r.message || 'Код не получился. Привяжи по QR.')); return; }
      pairOut.replaceChildren(h('div', {class: 'url mono'}, r.code),
        h('p', 0, 'В WhatsApp: Настройки → Связанные устройства → Привязать устройство → «Привязать по номеру телефона», и введи этот код.'));
    }, 'alt')),
    pairOut);
  function paint(r) {
    ui.wa = r.state === 'connected';
    if (S && S.wa) { S.wa.linked = r.linked; S.wa.lost = r.lost; }
    if (r.state === 'connected') {
      status.replaceChildren(note('ok big', 'WhatsApp подключён. Кореш готов писать.'),
        btn('Отвязать WhatsApp', async () => {
          if (!confirm('Отвязать WhatsApp от Кореша?')) return;
          const o = await api('wa/logout', {});
          status.replaceChildren(note(o.ok ? 'info' : 'bad', o.ok ? 'Отвязано. Чтобы подключить заново, подожди пару секунд.' : (o.message || 'Не получилось.')));
        }, 'alt'));
    } else if (r.state === 'need_qr' || r.state === 'logged_out') {
      status.replaceChildren(
        r.qr ? h('img', {src: r.qr, alt: 'QR-код для привязки WhatsApp', width: 240, height: 240, class: 'qr'}) : note('info', 'Готовлю QR-код…'),
        h('ol', {class: 'steps'},
          h('li', 0, 'Открой WhatsApp на телефоне, номер которого подключаешь.'),
          h('li', 0, 'Настройки → Связанные устройства → Привязать устройство.'),
          h('li', 0, 'Наведи камеру на QR-код. Он обновляется сам, страницу не закрывай.')));
    } else {
      status.replaceChildren(note('info', 'Готовлю подключение… Это занимает несколько секунд.'));
    }
  }
  async function tick() {
    const r = await api('wa/link');
    if (r.ok) paint(r); else if (r.error === 'need_consent') { W.consent = false; stopPoll(); waLink(box, W, only); }
  }
  status.replaceChildren(note('info', 'Готовлю подключение…'));
  tick();
  pollTimer = setInterval(tick, 2500);
}
function waContacts(box, W) {
  box.replaceChildren(note('info', 'Загружаю контакты…'));
  api('wa/contacts').then(r => {
    if (!r.ok) { box.replaceChildren(note('bad', r.message || 'Контакты не загрузились.')); return; }
    const rows = [];                                     // вручную: {name, phone, nick}
    const hidden = new Set(r.synced.filter(c => c.hidden).map(c => c.number));
    const nicks = {};
    r.synced.forEach(c => { if (c.nicks.length) nicks[c.number] = c.nicks.join(', '); });
    Object.keys(r.manual_nicks || {}).forEach(n => { if (r.manual_nicks[n].length) nicks[n] = r.manual_nicks[n].join(', '); });
    const manualBox = h('div');
    const out = h('div');
    function addRow(name, num, nick) {
      const nm = h('input', {type: 'text', maxlength: 40, placeholder: 'Имя (Оля)', 'aria-label': 'Имя', value: name || ''});
      const ph = phoneField(num);
      const nk = h('input', {type: 'text', maxlength: 60, placeholder: 'Прозвище (жена)', 'aria-label': 'Прозвище', value: nick || ''});
      const row = {nm, ph, nk, del: false};
      const x = h('button', {type: 'button', class: 'x', 'aria-label': 'Убрать', on: {click: () => { row.del = true; el.replaceChildren(); }}}, '×');
      const el = h('div', {class: 'row', style: 'grid-template-columns:1fr 1.2fr 1fr 44px'}, nm, ph, nk, x);
      rows.push(row);
      manualBox.append(el);
    }
    r.manual.forEach(([n, p]) => addRow(n, p, nicks[String(p).replace(/\D/g, '')] || ''));
    if (!r.manual.length) addRow('', '', '');
    // контакты из WhatsApp: поиск, «скрыть», прозвища
    const q = h('input', {type: 'search', placeholder: 'Поиск по имени', 'aria-label': 'Поиск по контактам'});
    const list = h('div');
    function paintList() {
      const f = String(q.value || '').trim().toLowerCase();
      const hit = r.synced.filter(c => !f || c.name.toLowerCase().includes(f) || (nicks[c.number] || '').toLowerCase().includes(f));
      list.replaceChildren(...hit.slice(0, 100).map(c => {
        const cb = h('input', {type: 'checkbox', checked: hidden.has(c.number), 'aria-label': 'Скрыть ' + c.name});
        cb.addEventListener('change', () => { if (cb.checked) hidden.add(c.number); else hidden.delete(c.number); });
        const nk = h('input', {type: 'text', maxlength: 60, placeholder: 'Прозвище (жена)', 'aria-label': 'Прозвище для ' + c.name, value: nicks[c.number] || ''});
        nk.addEventListener('input', () => { nicks[c.number] = nk.value; });
        return h('div', {class: 'row', style: 'grid-template-columns:1.3fr 1fr auto'},
          h('span', 0, c.name, ' ', h('span', {class: 'small mono'}, '…' + c.number.slice(-4))), nk,
          h('label', {class: 'small'}, cb, ' скрыть'));
      }), hit.length > 100 ? h('p', {class: 'small'}, 'Показаны первые 100 из ' + hit.length + ', уточни поиск.') : null,
      hit.length ? null : h('p', {class: 'small'}, 'Ничего не найдено.'));
    }
    q.addEventListener('input', paintList);
    paintList();
    let syncNote = null;
    if (!r.synced.length) {
      syncNote = W.sync === 'empty' ? note('warn', 'WhatsApp не отдал контакты, добавь нужных руками.')
        : (W.sync === 'pending' ? note('info', 'Контакты подтягиваются из WhatsApp, это может занять минуту. Обнови шаг, если список не появился.')
        : note('info', 'Контакты из WhatsApp подтянутся сами после привязки. Нужных можно добавить и руками.'));
    }
    box.replaceChildren(
      h('p', {class: 'small'}, 'После привязки имена подтягиваются из WhatsApp сами. Лишних можно скрыть, а любому дать прозвище: «жена» → Оля. Номера в мозг Кореша не уходят, поиск по имени делает сервер.'),
      syncNote,
      r.synced.length ? h('div', 0, h('p', {class: 'small'}, 'Из WhatsApp: ' + r.synced.length), q, list) : null,
      h('h3', 0, 'Добавить руками'),
      h('p', {class: 'small'}, 'Имя, номер в формате +7XXXXXXXXXX и, если хочешь, прозвище. До 30 штук.'),
      manualBox, btn('+ ещё контакт', () => addRow('', '', ''), 'alt'),
      h('div', {style: 'margin-top:14px'}, btn('Сохранить контакты', async () => {
        const manual = [], mn = {};
        rows.filter(x => !x.del).forEach(x => {
          const name = String(x.nm.value || '').trim(), d = x.ph.digits();
          if (!name && !d) return;
          manual.push([name, '+' + d]);
          if (String(x.nk.value || '').trim() && d) mn[d] = x.nk.value;
        });
        const allNicks = Object.assign({}, nicks, mn);
        const res = await api('wa/contacts', {manual, hidden: [...hidden], nicks: allNicks});
        if (!res.ok) { out.replaceChildren(note('bad', res.message || 'Не получилось сохранить.')); return; }
        out.replaceChildren(note('ok', 'Сохранено. Применяется сразу. Контактов у Кореша: ' + res.count + '.'),
          res.persisted ? null : note('warn', 'Диск недоступен: контакты живут до перезапуска.'),
          res.overridden.length ? note('warn', 'Что-то задано в переменных Railway (' + res.overridden.join(', ') + ') и главнее страницы.') : null);
      })),
      out);
  });
}

/* ---------- 8. готово ---------- */
function stepDone() {
  const out = h('div');
  const row = (ok, text) => h('li', 0, h('span', {class: 'tag ' + (ok ? '' : 'lock')}, ok ? 'есть' : 'нет'), text);
  return h('div', 0,
    h('h2', 0, 'Шаг 8. Готово'),
    h('p', 0, 'Сводка перед закрытием. Красное можно не чинить, но тогда лучше знать, чего не хватает.'),
    h('ul', {class: 'list'},
      row(S.brain_key_set && ui.brain, 'Мозг: ключ проверен на шаге 1' + (S.brain_key_set && !ui.brain ? ' (ключ есть, но кнопку проверки не нажимали)' : '')),
      row(S.iot.set, 'Умный дом: токен подключён'),
      row(S.webhook.secret_set, 'Вебхук: секрет задан'),
      S.wa && S.wa.enabled ? row(S.wa.linked && !S.wa.lost, S.wa.lost ? 'WhatsApp: отвалился, нужна перепривязка (шаг 7)' : (S.wa.linked ? 'WhatsApp: подключён' : 'WhatsApp: не подключён (необязательно)')) : null,
      row(ui.heard, 'Яндекс достучался до вебхука' + (ui.heard ? '' : ' (на шаге 6 ещё не было запроса)')),
      row(S.memory === 'disk', S.memory === 'disk' ? 'Память: диск доступен' : 'Память: диск недоступен, Кореш будет забывать при перезапуске (нужен Volume на /data и RAILWAY_RUN_UID=0)'),
      h('li', 0, h('span', {class: 'tag'}, 'замки'), S.allow_locks.value ? 'Включены, только по кодовой фразе' : 'Выключены (так и должно быть по умолчанию)')),
    note('warn', 'После завершения страница закрывается. Вернуться сюда можно только с тем же кодом из бота и кнопкой «Перенастроить».'),
    S.callback ? h('p', {class: 'small'}, 'После завершения сервер отправит нам короткое «установлено»: без ключей клиента и без разговоров.') : null,
    btn('Завершить установку', async () => {
      if (!confirm('Закрыть страницу настройки?')) return;
      const r = await api('finish', {});
      if (!r.ok) { out.replaceChildren(note('bad', r.message || 'Не получилось.')); return; }
      setLogout(false);
      const cb = {sent: 'Сообщение «установлено» отправлено.', failed: 'Сообщение «установлено» отправить не вышло. Установка от этого не страдает, оператору сказать на словах.', off: ''}[r.callback] || '';
      app.replaceChildren(h('div', {class: 'card'}, h('h1', 0, 'Готово'),
        note('ok', 'Кореш настроен. Страница закрыта.'), cb ? note(r.callback === 'sent' ? 'info' : 'warn', cb) : null,
        h('p', 0, 'Чтобы поменять настройки, вернись на ', h('span', {class: 'mono'}, '/setup'), ' с кодом из бота.')));
    }),
    out);
}

/* ---------- запуск ---------- */
(async function init() {
  const r = await api('me');
  if (r.ok && r.authed) { if (r.wa_only) renderWaOnly(); else start(); return; }
  if (r.status === 404) { app.replaceChildren(h('p', 0, 'Страница настройки выключена.')); return; }
  if (r.ok && r.closed) { renderLogin('Настройка уже завершена.', true, r.wa_lost); return; }
  renderLogin(r.locked_for ? 'Слишком много неверных кодов, подожди.' : null, false, r.wa_lost);
})();
</script>
</body>
</html>
